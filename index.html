<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PF Ramiro - Entrenamientos Personalizados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CDN oficial de Supabase para navegador -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- BARRA SUPERIOR -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide text-emerald-400">⚡ PF Ramiro</h1>
    <div id="usuario-info" class="hidden items-center gap-3">
      <span id="user-email" class="text-sm text-slate-300"></span>
      <button onclick="cerrarSesion()" class="bg-red-500/20 text-red-300 hover:bg-red-500/30 px-3 py-1.5 rounded-lg text-sm font-medium transition">Salir</button>
    </div>
  </header>

  <!-- PANTALLA 1: LOGIN -->
  <main id="seccion-auth" class="max-w-md mx-auto mt-16 p-6 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl">
    <h2 class="text-2xl font-bold text-center mb-2">Ingresar a tus Entrenamientos</h2>
    <p class="text-sm text-slate-400 text-center mb-6">Ingresá tu correo y contraseña para ver tu plan</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Correo Electrónico</label>
        <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500" placeholder="tu@email.com">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
        <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
      </div>
      <button type="button" onclick="iniciarSesion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg transition active:scale-95">Iniciar Sesión</button>
      <button type="button" onclick="registrarse()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition text-sm active:scale-95">Crear cuenta nueva</button>
    </div>
    <p id="auth-mensaje" class="text-center text-sm mt-4 text-emerald-400"></p>
  </main>

  <!-- PANTALLA 2: PANEL DEL ALUMNO / ADMIN -->
  <main id="seccion-panel" class="hidden max-w-4xl mx-auto p-6 space-y-8">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <h2 class="text-2xl font-bold text-white mb-1">¡Hola de nuevo! 👋</h2>
      <p class="text-slate-400 text-sm">Acá tenés tus rutinas asignadas y el historial de entrenamientos.</p>
    </div>

    <!-- SECCIÓN DE CARGA (SOLO ADMIN/PROFESOR) -->
    <div id="seccion-admin" class="hidden bg-slate-800/60 p-6 rounded-2xl border border-emerald-500/30">
      <h3 class="text-lg font-bold text-emerald-400 mb-3">Panel de Entrenador (Asignar Rutina)</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <input type="text" id="admin-alumno-id" placeholder="ID del Alumno (uuid)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        <input type="text" id="admin-semana" placeholder="Semana o Mes (Ej: Semana 1)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        <input type="text" id="admin-dia" placeholder="Día (Ej: Lunes - Tren Superior)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
        <input type="text" id="admin-video" placeholder="Link de Video (YouTube)" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
      </div>
      <textarea id="admin-ejercicios" rows="3" placeholder="Detalle de ejercicios, series y repeticiones..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mb-4"></textarea>
      <button onclick="guardarRutina()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Guardar Rutina para Alumno</button>
    </div>

    <!-- LISTADO DE PLANIFICACIONES -->
    <div>
      <h3 class="text-xl font-bold mb-4 flex items-center gap-2">📋 Tu Plan de Entrenamiento</h3>
      <div id="lista-rutinas" class="grid grid-cols-1 gap-4">
        <p class="text-slate-500">Cargando tus entrenamientos...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://zuwqfzncybtwvwzwlqmw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_JNr-yY7bAtM8Sg4ioNXFcA_wMZOYuYq';

    let supabase;

    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (!window.supabase) {
          alert("Error: No se pudo cargar el script de Supabase. Revisa tu conexión a internet.");
          return;
        }

        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabase.auth.onAuthStateChange((event, session) => {
          if (session) {
            mostrarPanel(session.user);
          } else {
            mostrarLogin();
          }
        });
      } catch (err) {
        alert("Error iniciando Supabase: " + err.message);
      }
    });

    async function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("Por favor ingresa correo y contraseña.");
        return;
      }

      if (!supabase) {
        alert("Supabase todavía no está listo.");
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Error al ingresar: " + error.message);
    }

    async function registrarse() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("Por favor ingresa correo y contraseña.");
        return;
      }

      if (!supabase) {
        alert("Supabase todavía no está listo.");
        return;
      }

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert("Error al registrar: " + error.message);
      } else {
        alert("Cuenta creada con éxito. Ya podés iniciar sesión.");
      }
    }

    async function cerrarSesion() {
      if (supabase) await supabase.auth.signOut();
    }

    function mostrarLogin() {
      document.getElementById('seccion-auth').classList.remove('hidden');
      document.getElementById('seccion-panel').classList.add('hidden');
      document.getElementById('usuario-info').classList.add('hidden');
    }

    async function mostrarPanel(user) {
      document.getElementById('seccion-auth').classList.add('hidden');
      document.getElementById('seccion-panel').classList.remove('hidden');
      document.getElementById('usuario-info').classList.remove('hidden');
      document.getElementById('usuario-info').classList.add('flex');
      document.getElementById('user-email').innerText = user.email;

      if (user.email === 'axiss.training@gmail.com') {
        document.getElementById('seccion-admin').classList.remove('hidden');
      }

      cargarRutinas(user.id);
    }

    async function cargarRutinas(userId) {
      const contenedor = document.getElementById('lista-rutinas');
      const { data, error } = await supabase
        .from('planificaciones')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        contenedor.innerHTML = '<div class="p-6 bg-slate-800 rounded-xl text-slate-400">Todavía no tenés planificaciones cargadas. Tu entrenador te la asignará pronto.</div>';
        return;
      }

      contenedor.innerHTML = data.map(r => `
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs uppercase tracking-wide bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded font-bold">${r.semana || 'Plan'}</span>
            <span class="text-xs text-slate-400">${new Date(r.created_at).toLocaleDateString()}</span>
          </div>
          <h4 class="text-lg font-bold text-white">${r.dia || 'Entrenamiento'}</h4>
          <p class="text-slate-300 whitespace-pre-line text-sm">${r.ejercicios || ''}</p>
          ${r.url_video_ejemplo ? `<a href="${r.url_video_ejemplo}" target="_blank" class="inline-block text-sm text-emerald-400 hover:underline font-medium">▶ Ver Video de Referencia</a>` : ''}
        </div>
      `).join('');
    }

    async function guardarRutina() {
      const alumno_id = document.getElementById('admin-alumno-id').value;
      const semana = document.getElementById('admin-semana').value;
      const dia = document.getElementById('admin-dia').value;
      const url_video_ejemplo = document.getElementById('admin-video').value;
      const ejercicios = document.getElementById('admin-ejercicios').value;

      const { error } = await supabase.from('planificaciones').insert([{
        alumno_id: alumno_id,
        semana: semana,
        dia: dia,
        url_video_ejemplo: url_video_ejemplo,
        ejercicios: ejercicios
      }]);

      if (error) alert("Error al guardar: " + error.message);
      else {
        alert("¡Rutina cargada con éxito!");
        location.reload();
      }
    }
  </script>
</body>
</html>
