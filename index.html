<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PF Ramiro Abbattista - Rendimiento & Fuerza</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PF Ramiro">
  <meta name="theme-color" content="#020617">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .serie-done-box {
      background-color: rgba(16, 185, 129, 0.15) !important;
      border-color: rgba(16, 185, 129, 0.5) !important;
    }
    .sortable-ghost {
      opacity: 0.3;
      background-color: #064e3b !important;
    }
    .cursor-grab {
      cursor: grab;
      touch-action: none;
    }
    .tab-dia-active {
      background-color: #10b981 !important;
      color: #020617 !important;
      font-weight: 900 !important;
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.35);
    }
    .tab-sem-active {
      background-color: #059669 !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      border-color: #10b981 !important;
    }
    .avatar-circulo {
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background-color: #0f172a;
      border: 2px solid #10b981;
      flex-shrink: 0;
    }
    .btn-tipo-barra-active {
      background-color: #10b981 !important;
      color: #020617 !important;
      font-weight: 900 !important;
    }
    @media print {
      header, #timer-box, #dashboard-alumno, #seccion-admin, button, .no-print, .tabs-dias-container, #modal-discos, #modal-ficha-coach, #modal-creador-rapido {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
      .print-clean {
        border: 1px solid #ccc !important;
        background: transparent !important;
        color: black !important;
        box-shadow: none !important;
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 antialiased select-none">

  <!-- TOAST DE AUTOGUARDADO -->
  <div id="toast-guardado" class="fixed top-16 right-4 bg-emerald-500 text-slate-950 text-xs font-black px-3 py-1.5 rounded-xl shadow-xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-1.5">
    <span>✓ Guardado en la Nube</span>
  </div>

  <!-- MODAL / VENTANA EMERGENTE ESTILO BULDOZR: CREADOR RÁPIDO DE PLANIFICACIÓN -->
  <div id="modal-creador-rapido" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-6">
    <div class="bg-slate-900 border border-slate-700 max-w-3xl w-full rounded-3xl p-5 md:p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h4 class="font-black text-white text-base flex items-center gap-2">🛠️ Diseñador Rápido de Planificación</h4>
          <span class="text-[11px] text-slate-400">Configura sesiones con videos técnicos predeterminados y progresión adaptada.</span>
        </div>
        <button type="button" onclick="cerrarModalCreadorRapido()" class="text-slate-400 hover:text-white font-bold text-sm bg-slate-800 p-2 rounded-xl">✕</button>
      </div>

      <!-- CAMPOS CABECERA DE SESIÓN -->
      <div class="space-y-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] font-bold text-cyan-400 block mb-1">Entorno:</label>
            <select id="admin-entorno" class="w-full bg-slate-900 border border-cyan-500/40 text-cyan-300 rounded-xl p-2 text-xs font-bold">
              <option value="KOENA">Koena (Sede Presencial)</option>
              <option value="ONLINE">🌐 Personalizado Online</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-emerald-400 block mb-1">Alumno Registrado:</label>
            <select id="sel-alumno-creador" onchange="seleccionarAlumnoCreador(this.value)" class="w-full bg-slate-900 border border-emerald-500/50 text-white rounded-xl p-2 text-xs font-bold">
              <option value="">▼ Seleccionar Alumno...</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2 pt-1 border-t border-slate-800/80">
          <div>
            <label class="text-[10px] text-slate-400 font-bold block mb-1">Usuario</label>
            <input type="text" id="admin-alumno" readonly class="w-full bg-slate-900/60 border border-slate-800 rounded-xl p-2 text-xs text-slate-300 font-mono" placeholder="Seleccioná arriba">
          </div>
          <div>
            <label class="text-[10px] text-emerald-400 font-bold block mb-1">WhatsApp</label>
            <input type="tel" id="admin-alumno-tel" inputmode="tel" placeholder="11 2345-6789" class="w-full bg-slate-900 border border-emerald-500/40 rounded-xl p-2 text-xs text-white font-mono">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-bold block mb-1">Mesociclo</label>
            <input type="text" id="admin-mes" placeholder="Mes 1 - Fuerza Base" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-bold block mb-1">Duración</label>
            <select id="admin-duracion-semanas" onchange="actualizarColumnasMatrizCoach()" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-emerald-300 font-bold">
              <option value="4">4 Semanas</option>
              <option value="5" selected>5 Semanas</option>
              <option value="6">6 Semanas</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-bold block mb-1">Día / Solapa</label>
            <input type="text" id="admin-dia" placeholder="Lunes (o Día 1)" class="w-full bg-slate-900 border border-emerald-500/50 rounded-xl p-2 text-xs text-emerald-300 font-bold">
          </div>
        </div>
      </div>

      <!-- SELECTOR DE EJERCICIOS CON AUTO-VIDEO ESTILO BULDOZR -->
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <span class="text-xs uppercase font-extrabold text-emerald-400 tracking-wider">Configurar Ejercicio por Bloque</span>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="aplicarPresetProgresionRamiro()" class="text-[11px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-lg font-black">
              ⚡ Aplicar Progresión
            </button>
            <button type="button" onclick="crearNuevoEjercicio()" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-emerald-300 font-bold">+ Crear</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-6 gap-2">
          <div class="md:col-span-2">
            <label class="text-[10px] text-slate-400 font-bold">Bloque</label>
            <select id="inp-bloque" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-emerald-300 font-bold mt-1">
              <option value="BLOQUE A — MOVILIDAD ARTICULAR & ENTRADA EN CALOR">BLOQUE A — MOVILIDAD & CALOR</option>
              <option value="BLOQUE B — ACTIVACIÓN & ZONA MEDIA (CORE)">BLOQUE B — ACTIVACIÓN & CORE</option>
              <option value="BLOQUE C — POTENCIA / LEVANTAMIENTO OLÍMPICO">BLOQUE C — POTENCIA / OLÍMPICO</option>
              <option value="BLOQUE D — FUERZA PRINCIPAL" selected>BLOQUE D — FUERZA PRINCIPAL</option>
              <option value="BLOQUE E — TRACCIONES & ACCESORIOS">BLOQUE E — TRACCIONES & ACCESORIOS</option>
              <option value="BLOQUE F — FINISHER & METABÓLICO">BLOQUE F — FINISHER & METABÓLICO</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="text-[10px] text-slate-400 font-bold">Categoría</label>
            <select id="sel-categoria" onchange="cargarEjerciciosPorCategoria()" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 mt-1">
              <optgroup label="Fuerza, Rendimiento & Potencia">
                <option value="inferior_rodilla" selected>Tren Inferior - Dominantes Rodilla</option>
                <option value="inferior_cadera">Tren Inferior - Dominantes Cadera</option>
                <option value="superior_empuje">Tren Superior - Empujes</option>
                <option value="tracciones_vertical_horizontal">Tren Superior - Tracciones</option>
                <option value="olimpicos_variantes">Levantamiento Olímpico</option>
                <option value="balisticos">Potencia & Pliometría</option>
              </optgroup>
              <optgroup label="Activación, Movilidad & Core">
                <option value="zona_media_koena">Zona Media & Antirrotación (Core)</option>
                <option value="activacion_gluteos">Activación de Glúteos</option>
                <option value="calentamiento_dinamico">Entrada en Calor Dinámica</option>
                <option value="mov_tobillo">Movilidad - Tobillo</option>
                <option value="mov_cadera">Movilidad - Cadera</option>
                <option value="mov_toracica">Movilidad - Columna Torácica</option>
                <option value="mov_hombros">Movilidad - Hombro y Escápula</option>
                <option value="personalizados">Mis Ejercicios Creados</option>
              </optgroup>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="text-[10px] text-slate-400 font-bold">Ejercicio (Trae Video Automático)</label>
            <select id="sel-ejercicio" onchange="actualizarVideoAutomatico()" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 mt-1"></select>
          </div>
        </div>

        <!-- MATRIZ SEMANAL DINÁMICA -->
        <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-2">
          <span class="text-[10px] font-black text-emerald-400 uppercase tracking-wider block">🎯 Prescripción Semanal de Cargas:</span>
          
          <div id="grid-matriz-coach" class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
            <div class="bg-slate-950 p-1.5 rounded-lg border border-slate-800">
              <span class="text-[9px] font-bold text-slate-400 block mb-0.5">Semana 1:</span>
              <input type="text" id="prog-s1-reps" value="3x8 reps" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mb-1 text-white font-mono text-[11px]">
              <input type="text" id="prog-s1-carga" value="70%" class="w-full bg-slate-900 border border-emerald-500/40 rounded p-1 text-emerald-300 font-mono font-bold text-[11px]">
            </div>
            <div class="bg-slate-950 p-1.5 rounded-lg border border-slate-800">
              <span class="text-[9px] font-bold text-slate-400 block mb-0.5">Semana 2:</span>
              <input type="text" id="prog-s2-reps" value="4x8 reps" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mb-1 text-white font-mono text-[11px]">
              <input type="text" id="prog-s2-carga" value="75%" class="w-full bg-slate-900 border border-emerald-500/40 rounded p-1 text-emerald-300 font-mono font-bold text-[11px]">
            </div>
            <div class="bg-slate-950 p-1.5 rounded-lg border border-slate-800">
              <span class="text-[9px] font-bold text-slate-400 block mb-0.5">Semana 3:</span>
              <input type="text" id="prog-s3-reps" value="4x6 reps" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mb-1 text-white font-mono text-[11px]">
              <input type="text" id="prog-s3-carga" value="80%" class="w-full bg-slate-900 border border-emerald-500/40 rounded p-1 text-emerald-300 font-mono font-bold text-[11px]">
            </div>
            <div class="bg-slate-950 p-1.5 rounded-lg border border-slate-800">
              <span class="text-[9px] font-bold text-slate-400 block mb-0.5">Semana 4:</span>
              <input type="text" id="prog-s4-reps" value="4x4 reps" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mb-1 text-white font-mono text-[11px]">
              <input type="text" id="prog-s4-carga" value="85%" class="w-full bg-slate-900 border border-emerald-500/40 rounded p-1 text-emerald-300 font-mono font-bold text-[11px]">
            </div>
            <div id="col-s5-coach" class="bg-slate-950 p-1.5 rounded-lg border border-emerald-500/50">
              <span class="text-[9px] font-bold text-emerald-400 block mb-0.5">Semana 5 (Fallo):</span>
              <input type="text" id="prog-s5-reps" value="12-8-6-4 + 1xFallo" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mb-1 text-white font-mono text-[11px]">
              <input type="text" id="prog-s5-carga" value="90%+" class="w-full bg-slate-900 border border-emerald-500 rounded p-1 text-emerald-300 font-
